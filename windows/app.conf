# ARTEMIS Chile Lite para Windows 10/11 (WebView2) — lo usa REGLA3/herramientas/winhost/construir.sh
NOMBRE="ARTEMIS Chile Lite"
EXE=ArtemisLite
VERSION=1.0
DESCRIPCION="Versión simple de ARTEMIS: un curso con estudiantes, asistencia y notas, sin internet"
ARCHIVOS_EXTRA='  File /r "..\dist\ui"'
copiar_extra() { rm -rf "$1/ui"; mkdir -p "$1/ui"; cp -r "$W/../app/css" "$W/../app/js" "$W/../app/fuentes" "$W/../app/img" "$W/../app/index.html" "$1/ui/"; }
