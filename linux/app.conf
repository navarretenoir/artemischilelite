# ARTEMIS Chile Lite — configuración de empaquetado Linux (la usa REGLA3/herramientas/linux-pkg/empaquetar.sh)
APP_ID=io.github.navarretenoir.ARTEMISChileLite
PAQUETE=artemis-lite
NOMBRE="ARTEMIS Chile Lite"
NOMBRE_ARCHIVO=ARTEMISChileLite
VERSION=$(cat "$APP/VERSION")
BIN_GUI=artemis-lite
RESUMEN="Estudiantes, asistencia y notas de un curso, sin internet"
DESCRIPCION="Versión simple de ARTEMIS para profesoras y profesores de Chile: un curso con su lista de estudiantes, asistencia y notas con promedio. Sin internet y sin cuentas; para una versión completa, contacta a la desarrolladora."
DEPS_RPM="gtk4, webkitgtk6.0"
DEPS_DEB="libgtk-4-1, libwebkitgtk-6.0-4"
FLATPAK_EXTRA=""
SNAP_EXTRA=""
compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/desktop/." "$w/"; rm -f "$w/artemis-lite"
  make -s -C "$w" UI_DIR="$pre/share/artemis-chile-lite/ui" >/dev/null; strip "$w/artemis-lite"; cp "$w/artemis-lite" "$out/"
  rm -rf "$w"
}
instalar() {
  install -Dm755 "$3/artemis-lite" "$1$2/bin/artemis-lite"
  mkdir -p "$1$2/share/artemis-chile-lite/ui"; cp -r "$APP/app/." "$1$2/share/artemis-chile-lite/ui/"; rm -rf "$1$2/share/artemis-chile-lite/ui/"*.bak*
  sed -i '/Content-Security-Policy/d' "$1$2/share/artemis-chile-lite/ui/index.html"   # desde file:// la CSP del navegador no aplica (sin red de todos modos)
}
appimage_entorno() { echo 'export ARTEMISLITE_UI="$HERE/usr/share/artemis-chile-lite/ui"'; }
