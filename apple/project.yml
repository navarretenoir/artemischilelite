# ARTEMISLite para macOS (Intel + Apple Silicon, binario universal) e iOS/iPadOS — proyecto XcodeGen.
# Generar: brew install xcodegen && ./preparar-web.sh && xcodegen generate && open ARTEMISLite.xcodeproj
# Desarrollado por Javiera Navarrete.
name: ARTEMISLite
options:
  bundleIdPrefix: io.github.navarretenoir
  deploymentTarget: { iOS: "15.0", macOS: "11.0" }
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Javiera Navarrete. Desarrollado por Javiera Navarrete."
targets:
  ARTEMISLite-macOS:
    type: application
    platform: macOS
    sources: [Comun, ARTEMISLite, { path: Recursos/web, type: folder, buildPhase: resources }, Recursos/Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: ARTEMISLite
        PRODUCT_BUNDLE_IDENTIFIER: io.github.navarretenoir.artemischilelite
        ARCHS: "$(ARCHS_STANDARD)"          # arm64 + x86_64: corre nativo en Apple Silicon e Intel
        ONLY_ACTIVE_ARCH: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Recursos/ARTEMISLite.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    info:
      path: Recursos/Info-macOS.plist
      properties:
        CFBundleDisplayName: "ARTEMIS Lite"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSHumanReadableCopyright: "© 2026 Javiera Navarrete"

  ARTEMISLite-iOS:
    type: application
    platform: iOS
    sources: [Comun, ARTEMISLite, { path: Recursos/web, type: folder, buildPhase: resources }, Recursos/Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: ARTEMISLite
        PRODUCT_BUNDLE_IDENTIFIER: io.github.navarretenoir.artemischilelite
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Recursos/Info-iOS.plist
      properties:
        CFBundleDisplayName: "ARTEMIS Lite"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false

